<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Pokédex</title>

  <!-- Favicon en la pestaña -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

  <!-- Enlace al archivo CSS en la carpeta css/ -->
  <link rel="stylesheet" href="css/estilos.css">

</head>
<body>

  <h1>⚡ Mi Pokédex ⚡</h1>
  <p>Haz clic en un Pokémon para ver su información:</p>

  <!-- Botones de Pokémon -->
  <div class="botones">
    <button onclick="verPokemon('pikachu')">Pikachu</button>
    <button onclick="verPokemon('bulbasaur')">Bulbasaur</button>
    <button onclick="verPokemon('charmander')">Charmander</button>
    <button onclick="verPokemon('squirtle')">Squirtle</button>
    <button onclick="verPokemon('eevee')">Eevee</button>
  </div>

  <!-- Tarjeta interactiva -->
  <div class="card">
    <h2 id="nombre">Pikachu</h2>
    <img id="imagen" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Pokémon">
    <p id="tipo">Tipo: Eléctrico</p>
  </div>

  <!-- Enlace al archivo JS en la carpeta js/ -->
  <script src="js/script.js"></script>

</body>
</html>
