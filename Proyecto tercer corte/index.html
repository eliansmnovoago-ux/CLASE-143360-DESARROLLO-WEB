<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
  <title>Ruta Mundo - Agencia de Viajes</title>

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- Barra de Navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">RUTA MUNDO</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link active" href="#">Inicio</a>
        <a class="nav-link" href="#catalogo">Catálogo</a>
        <a class="nav-link" href="#contacto">Contacto</a>
      </div>
    </div>
  </nav>

  <div class="container my-5">

    <!-- Sección Hero -->
    <div class="hero-section p-5 mb-5 rounded-4 text-white shadow">
      <h1 class="display-5 fw-bold">Explora nuevos destinos</h1>
      <p class="lead">Encuentra tu próxima aventura</p>
      <a href="#catalogo" class="btn btn-info text-dark fw-bold mt-2">Ver paquetes</a>
    </div>

    <!-- Simulador de Reserva -->
    <div class="card p-4 mb-5 shadow-sm border-0 bg-light">
      <h3 class="h4 mb-3 text-secondary">Simulador de Reservas</h3>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label for="destinoSelect" class="form-label">Selecciona el Destino:</label>
          <select id="destinoSelect" class="form-select"></select>
        </div>
        <div class="col-md-4 mb-3">
          <label for="viajeros" class="form-label">Número de viajeros:</label>
          <input id="viajeros" type="number" class="form-control" min="1" value="1">
        </div>
        <div class="col-md-4 mb-3 d-flex align-items-end">
          <button id="reservarBtn" class="btn btn-primary w-100">Simular Reserva</button>
        </div>
      </div>
    </div>

    <!-- Catálogo de Destinos (8 elementos) -->
    <h2 id="catalogo" class="mb-4">Catálogo de Destinos</h2>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4 mb-5" id="tarjetasCatalogo">
      <!-- Se llenarán dinámicamente desde app.js -->
    </div>

    <!-- Historial de reservas simuladas -->
    <h3 class="mb-3">Resumen de Reservas Realizadas</h3>
    <ul id="listaReservas" class="list-group mb-5"></ul>

  </div>

  <script src="app.js"></script>
</body>
</html>
