<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
  <title>Veterinaria Estrellitas del Cielo</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="container mt-5">

    <h1>Veterinaria Estrellitas del Cielo</h1>
    <h2>Registro de mascotas</h2>

    <label for="nombre">Nombre:</label>
    <input id="nombre" type="text" class="form-control mb-3">

    <label for="especie">Especie:</label>
    <select id="especie" class="form-select mb-3">
      <option>Perro</option>
      <option>Gato</option>
    </select>

    <label for="edad">Edad:</label>
    <input id="edad" type="number" class="form-control mb-3">

    <button id="registrar" class="btn btn-primary">Registrar mascota</button>

    <ul id="lista" class="list-group mt-3"></ul>

  </div>

  <script src="app.js"></script>
</body>
</html>
